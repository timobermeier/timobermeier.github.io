publications:
  - title: "Welfare Inequality with Collective Households: A Tale of Consumption, Time Use and Preference Heterogeneity"
    venue: "Journal of the European Economic Association, conditionally accepted"
    links:
      - label: Paper
        url: https://drive.google.com/file/d/1p9BoHU9xlSSK440ZVzGA79VaowlfQf4V/view?usp=sharing
    # Abstract of the Oct 2023 working paper with this title; the JEEA version may differ.
    abstract: >-
      A common approach to analysing inequality focuses on household income and assumes the
      absence of intra-household inequality and homogenous equivalence scales. To study the
      role of these assumptions, I build a model of household decision-making and the marriage
      market. I estimate the model using British data and use it to measure individual
      well-being in terms of the Money-Metric Welfare Index (MMWI, Chiappori and Meghir
      (2015)). Comparing inequality in individual-level welfare and household-level income, I
      find that welfare inequality is 11% lower than income inequality. Intra-household
      inequality accounts for 21% of welfare inequality and heterogeneity in economies of
      scale for 15%.

  - title: "An Engine of (Pay) Growth? Productivity and Wages in the UK Auto Industry"
    coauthors:
      - name: Agnes Norris Keiller
        url: https://a-norriskeiller.github.io/
      - name: Andreas Teichgraeber
        url: https://ateichgr.github.io/
      - name: John Van Reenen
        url: https://www.johnvanreenen.com/
    venue: "Labour Economics, 103, 2026, 102970"
    links:
      - label: Paper
        url: https://www.sciencedirect.com/science/article/pii/S0927537126001223
      - label: CentrePiece
        url: https://cep.lse.ac.uk/pubs/download/cp699.pdf
    abstract: >-
      To what extent do identical workers in an industry benefit from productivity growth in
      the same industry? We study this question in the context of the UK auto industry which
      experienced a thirteen-fold increase in output per worker between 1980 and 2018. Over
      the same period, auto workers saw substantially stronger hourly wage growth than workers
      in other manufacturing industries. Controlling for unobserved worker heterogeneity, the
      auto wage premium over other manufacturing workers doubled from 8% in the 1980s to 17%
      in the 2010s, while the manufacturing premium over the rest of the economy remained
      roughly stable at 5%. Interpreted through the lens of a rent sharing model, we estimate
      that 63% of the increase in the raw firm-level auto wage premium can be accounted for by
      strong productivity growth. In contrast, differential bargaining power between auto
      workers cannot account for these changes.

  - title: "Employer Screening and Optimal Unemployment Insurance"
    coauthors:
      - name: Mario Meier
    venue: "The Economic Journal, 135(667), 2025, 671–711"
    links:
      - label: Paper
        url: https://academic.oup.com/ej/advance-article/doi/10.1093/ej/ueae095/7876487?guestAccessKey=6dea5575-fd33-41d6-9f1e-d784aab3d6a9
    abstract: >-
      Field experiments show that employers are less likely to consider long-term unemployed
      job seekers for interviews. We study the implications for optimal unemployment
      insurance. Based on a structural model of job search and recruitment, estimated with
      German data, we analyse the optimal two-tier unemployment system. We find that screening
      makes the optimal initial benefit level 4 percentage points higher and the potential
      benefit duration seven months longer. Using an extended Baily–Chetty formula, we study
      the mechanisms through which screening affects the consumption smoothing gain and moral
      hazard cost of providing unemployment insurance and highlight the role of the
      externality from endogenous firm behaviour.

  - title: "Firms and Inequality"
    coauthors:
      - name: Jan De Loecker
        url: https://sites.google.com/site/deloeckerjan/home
      - name: John Van Reenen
        url: https://www.johnvanreenen.com/
    venue: "Oxford Open Economics, 3(S1), 2024, i962–i982"
    links:
      - label: Paper
        url: https://academic.oup.com/ooec/article/3/Supplement_1/i962/7708115
      - label: IFS Deaton Review
        url: https://ifs.org.uk/inequality/about-the-review/
    abstract: >-
      We review the existing literature on falling business dynamism and present a new
      analysis using comprehensive UK firm-level panel data. Since the mid-1990s, there has
      been a large increase in UK firm-level inequality (especially in the upper tails) of
      productivity, wages, markups and labour shares, similarly to the USA. We suggest a
      simple theoretical framework for understanding some of these trends and quantitatively
      analyse why, despite increasing markups, the UK labour share has not fallen as sharply
      as that in the USA. Finally, we suggest some policy options in response to these
      worrying trends, including modernizing competition rules to deal with the growth of
      superstar firms and strengthening worker bargaining power.

working_papers:
  - title: "Job Loss, Remarriage and Marital Sorting"
    coauthors:
      - name: Hanno Foerster
        url: http://hannofoerster.com/home
      - name: Bastian Schulz
        url: https://sites.google.com/site/schulzbastian/
    status: "Resubmitted to American Economic Journal: Macroeconomics"
    links:
      - label: Paper
        url: https://drive.google.com/file/d/1ogv2uacCuCPRwD-NrtmFONJ0CUpDmOB_/view
    abstract: >-
      We investigate how job displacement affects whom men marry and study implications for
      marriage market matching theory. Leveraging quasi-experimental variation from Danish
      establishment closures, we show that job displacement leads men to break up if matched
      with low-earning women and to re-match with higher earning women. We use a general
      search and matching model of the marriage market to derive several implications of our
      empirical findings: (i) husbands' and wives' incomes are substitutes rather than
      complements in the marriage market; (ii) our findings are hard to reconcile with
      one-dimensional matching, but are consistent with multidimensional matching; (iii) a
      substantial part of the cross-sectional correlation between spouses' incomes arises
      spuriously from sorting on unobserved characteristics. We highlight the relevance of our
      results by simulating how the effect of rising individual-level inequality on
      between-household inequality is shaped by marital sorting.

  - title: "Marriage, Intra-Household Inequality and Wage Risk"
    coauthors:
      - name: Piotr Denderski
        url: https://sites.google.com/site/piotrdenderski/
    status: "R&R at American Economic Journal: Macroeconomics"
    links:
      - label: Paper
        url: https://drive.google.com/file/d/1bG0pZpeBlhAHHgBrZKsYOV5cdyjBd_X3/view?usp=share_link
    abstract: >-
      How well are workers insured against idiosyncratic wage risk? We revisit this question
      using a two-earner life-cycle model with endogenous intra-household allocations and
      marital status dynamics. In a model calibrated to the US, intra-household consumption
      inequality explains nearly one-fifth of overall inequality. The welfare cost of wage
      risk is 50% higher than in the unitary household benchmark. A proportional tax reform
      induces a sizable welfare loss, with women's welfare falling over four times as much as
      men's due to stronger labor supply responses. Progressive taxation thus provides
      disproportionately greater insurance for women once intra-household inequality and
      marriage dynamics are considered.

  - title: "Cohabitation, Child Development, and College Costs"
    coauthors:
      - name: Efi Adamopoulou
        url: https://sites.google.com/site/efiadamopoulou/
      - name: Anne Hannusch
        url: https://www.anne-hannusch.com/research
      - name: Karen Kopecky
        url: http://karenkopecky.net/
    status: "R&R at American Economic Journal: Macroeconomics"
    links:
      - label: Paper
        url: https://www.dropbox.com/scl/fo/fc4oeat381iqy57mhphzs/h?dl=0&e=1&preview=Cohabitation_and_Child_Development.pdf&rlkey=tmbpp6nx6rmgcs4u258t99d8g
    abstract: >-
      US college-educated couples with children marry at higher rates than those without a
      college degree. We argue that marriage, which entails lower separation risk and more
      equitable asset division if separation occurs, provides insurance to the lower-earning
      spouse, facilitating child investment. Investing in children is more valuable for
      college-educated couples, who are more likely to send their children to college. Using
      an OLG model of marriage, cohabitation, wealth accumulation, and educational investments
      where college is costly and completion is risky, we find that high college costs reduce
      incentives to marry among couples without a college degree. These differences in union
      choice by education heighten differences in children's educational attainment and reduce
      intergenerational mobility.

  - title: "When Trade Drives Markup Divergence: An Application to Auto Markets"
    coauthors:
      - name: Agnes Norris Keiller
        url: https://a-norriskeiller.github.io/
      - name: Andreas Teichgraeber
        url: https://ateichgr.github.io/
      - name: John Van Reenen
        url: https://www.johnvanreenen.com/
    links:
      - label: Paper
        url: https://poid.lse.ac.uk/textonly/publications/downloads/poidwp099.pdf
    abstract: >-
      When firms sell in multiple markets, estimates of markups from the demand-side will
      generally diverge from estimates based on the supply-side (e.g. via production
      functions). The empirical examination of the importance of this fact has been hampered
      by the absence of market-specific cost data. To overcome this, we show production
      markups can be expressed as the revenue-weighted average of demand-based markups across
      markets (and products). This highlights that a divergence in demand-based and
      production-based markups is due to the revenue shares and markups across foreign and
      domestic markets, factors that can be assessed with readily available trade data. Using
      data from auto firms producing in the UK, we show production-based markups increased
      between 1998 and 2018 whereas demand-based markups decreased. These trends can be
      reconciled by an increase in the markup that UK-based producers gained on their exports,
      which we corroborate using administrative trade data. We find that increases in
      production-based markups have been driven by exports, particularly to China where
      foreign brands command high markups.

  - title: "Household Taxation, Nonlinear Occupations and Gender Gaps"
    coauthors:
      - name: Piotr Denderski
        url: https://sites.google.com/site/piotrdenderski/
    links:
      - label: Paper
        url: https://drive.google.com/file/d/1fo3lje2xhl3wFRaobru0aiwebY3Ef64P/view?usp=share_link
    abstract: >-
      An enduring source of gender inequality is that some high-paying ("nonlinear")
      occupations penalize balancing work and household time commitments, as emphasized by
      Goldin (2014). We ask how household taxation interacts with these occupational
      differences to shape gender gaps in hours, wages, and occupational choice, and whether
      these differences materially affect the impact of tax reforms. We address these
      questions in a structural Roy model of household labor supply with occupation-specific
      earnings-hours nonlinearities and progressive taxation, calibrated to US data. We find
      that a balanced-budget switch to separately filed progressive taxes significantly
      reduces the gender gaps in hours and occupational choice, while the wage gap declines
      more modestly. These improvements arise because the reform lowers marginal tax rates for
      secondary earners and raises them for primary earners. By contrast, proportional
      taxation yields much smaller reductions in gender gaps. In both reforms, the standard
      labor-supply channel accounts for roughly two-thirds of the overall taxable-income
      response, while the convex earnings-hours relationship amplifies these effects and
      explains most of the remainder. Occupational switching contributes little because those
      who do switch are negatively selected.
